<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mont Saint-Michel | Europe by Rail</title>

    <link rel="stylesheet" href="../../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<main class="page-container gallery-city-index">

    <div class="site-mark">Neil. Q</div>

    <nav class="top-nav">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>
    </nav>

    <a
        class="trip-back"
        href="/travel/europe-by-rail/gallery/"
    >
        ← Europe Gallery
    </a>


    <header class="gallery-city-header">

        <h1>Mont Saint-Michel</h1>

        <p>Normandy · France · June 2026</p>

    </header>


    <!-- 3 Galleries -->

    <section class="category-grid">


        <!-- Sheep -->

        <a href="sheep/" class="category-card">

            <div class="category-image">
                <img
                    src="sheep/sheep1.jpg"
                    alt="Sheep"
                >
            </div>

            <div class="category-info">
                <span>01</span>
                <h2>Sheep</h2>
            </div>

        </a>


        <!-- Mount -->

        <a href="mount/" class="category-card">

            <div class="category-image">
                <img
                    src="mount/mount1.jpg"
                    alt="Mount"
                >
            </div>

            <div class="category-info">
                <span>02</span>
                <h2>Mount</h2>
            </div>

        </a>


        <!-- Tides -->

        <a href="tides/" class="category-card">

            <div class="category-image">
                <img
                    src="tides/tides1.jpg"
                    alt="Tides"
                >
            </div>

            <div class="category-info">
                <span>03</span>
                <h2>Tides</h2>
            </div>

        </a>


    </section>


    <div class="gallery-end">

        <a href="/travel/europe-by-rail/gallery/">
            ← Europe Gallery

    </div>
