<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>City | Brussels</title>

    <link rel="stylesheet" href="../../../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<main class="page-container photo-gallery-page">

    <div class="site-mark">Neil. Q</div>

    <nav class="top-nav">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>
    </nav>

    <a class="trip-back"
       href="/travel/europe-by-rail/gallery/brussels/">
        ← Brussels
    </a>

    <header class="photo-gallery-header">
        <p>Brussels · Belgium</p>
        <h1>City</h1>
    </header>


    <!-- 7 photos · 2 + 3 + 2 -->

    <section class="photo-grid layout-seven">

        <div class="photo-cell">
            <img src="city1.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="city2.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="city3.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="city4.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="city5.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="city6.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="city7.jpg" alt="" loading="lazy">
        </div>

    </section>


    <div class="gallery-end">
        <a href="/travel/europe-by-rail/gallery/brussels/">
            ← Brussels
        </a>
    </div>

</main>


<div class="photo-lightbox" id="photoLightbox">

    <button class="lightbox-close" aria-label="Close image">×</button>

    <button class="lightbox-prev" aria-label="Previous image">‹</button>

    <img id="lightboxImage" src="" alt="">

    <button class="lightbox-next" aria-label="Next image">›</button>

</div>


<script src="../gallery.js"></script>

</body>
</html>
