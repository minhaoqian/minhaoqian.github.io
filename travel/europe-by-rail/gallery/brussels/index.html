<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brussels | Europe by Rail</title>

    <link rel="stylesheet" href="../../../../style.css">

    <link

    >
</head>

<body>

<main class="page-container gallery-city-index">

    <div class="site-mark">Neil. Q</div>

    <nav class="top-nav">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>
    </nav>

    <a class="trip-back"
       href="/travel/europe-by-rail/gallery/">
        ← Europe Gallery
    </a>

    <header class="gallery-city-header">
        <h1>Brussels</h1>
        <p>Belgium · June 2026</p>
    </header>


    <!-- 4 Galleries -->

<section class="category-grid brussels-category-grid">


        <!-- Food -->

        <a href="food/" class="category-card">

            <div class="category-image">

            <div class="category-info">

        </a>


        <!-- City -->

        <a href="city/" class="category-card">

            <div class="category-image">

            <div class="category-info">
                <span>02</span>

        <!-- Euro -->

        <a href="euro/" class="category-card">

            <div class="category-image">

            </div>

            <div class="category-info">
                <span>03</span>
                <h2>Euro</h2>
            </div>

        </a>


        <!-- Streets -->

        <a href="streets/" class="category-card">

            <div class="category-image">
                <img src="streets/streets1.jpg" alt="Streets">

            <div class="category-info">
                <span>04</span>
                <h2>Streets</h2>
            </div>

    <div class="gallery-end">
