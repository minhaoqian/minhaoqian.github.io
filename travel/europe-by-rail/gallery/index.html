<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Gallery | Europe by Rail</title>

    <link rel="stylesheet" href="../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >

</head>


<body>

<main class="page-container gallery-index">

    <!-- Site identity -->

    <div class="site-mark">
        Neil. Q
    </div>


    <!-- Navigation -->

    <nav class="top-nav">

        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>

    </nav>


    <!-- Back -->

    <a
        class="trip-back"
        href="/travel/europe-by-rail/"
    >
        ← Europe by Rail
    </a>


    <!-- Gallery Header -->

    <section class="gallery-index-header">

        <h1>Gallery</h1>

        <p class="gallery-index-cn">
            照片，是时间留下的底片。
        </p>

        <p class="gallery-index-en">
            Photographs are the negatives of time.
        </p>

    </section>


    <!-- Places -->

    <section class="gallery-places">


        <!-- Amsterdam -->

        <a
            href="/travel/europe-by-rail/gallery/amsterdam/"
            class="gallery-place"
        >

            <div class="gallery-cover">

                <img
                    src="/travel/europe-by-rail/gallery/covers/amsterdam.jpg"
                    alt="Amsterdam"
                >

            </div>

            <div class="gallery-place-info">

                <span class="gallery-number">
                    01
                </span>

                <h2>
                    Amsterdam
                </h2>

                <p>
                    Netherlands
                </p>

            </div>

        </a>


        <!-- Brussels -->

        <a
            href="/travel/europe-by-rail/gallery/brussels/"
            class="gallery-place"
        >

            <div class="gallery-cover">

                <img
                    src="/travel/europe-by-rail/gallery/covers/brussels.jpg"
                    alt="Brussels"
                >

            </div>

            <div class="gallery-place-info">

                <span class="gallery-number">
                    02
                </span>

                <h2>
                    Brussels
                </h2>

                <p>
                    Belgium
                </p>

            </div>

        </a>


        <!-- Paris -->

        <a
            href="/travel/europe-by-rail/gallery/paris/"
            class="gallery-place"
        >

            <div class="gallery-cover">

                <img
                    src="/travel/europe-by-rail/gallery/covers/paris.jpg"
                    alt="Paris"
                >

            </div>

            <div class="gallery-place-info">

                <span class="gallery-number">
                    03
                </span>

                <h2>
                    Paris
                </h2>

                <p>
                    France
                </p>

            </div>

        </a>


        <!-- Mont Saint-Michel -->

        <a
            href="/travel/europe-by-rail/gallery/mont-saint-michel/"
            class="gallery-place"
        >

            <div class="gallery-cover">

                <img
                    src="/travel/europe-by-rail/gallery/covers/mont-saint-michel.jpg"
                    alt="Mont Saint-Michel"
                >

            </div>

            <div class="gallery-place-info">

                <span class="gallery-number">
                    04
                </span>

                <h2>
                    Mont Saint-Michel
                </h2>

                <p>
                    Normandy · France
                </p>

            </div>

        </a>


    </section>

</html>
