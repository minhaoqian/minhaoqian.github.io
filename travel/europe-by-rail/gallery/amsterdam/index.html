<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Amsterdam | Europe by Rail</title>

    <link rel="stylesheet" href="../../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>


<body>

<main class="page-container gallery-index">

    <!-- Site identity -->

    <div class="site-mark">
        Neil. Q
    </div>


    <!-- Navigation -->

    <nav class="top-nav">

        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>

    </nav>


    <!-- Back -->

    <a
        class="trip-back"
        href="/travel/europe-by-rail/gallery/"
    >
        ← Europe Gallery
    </a>


    <!-- Header -->

    <section class="gallery-index-header">

        <h1>Amsterdam</h1>

        <p class="gallery-index-en">
            Netherlands · June 2026
        </p>

    </section>


    <!-- Categories -->

    <section class="gallery-places">


        <!-- 01 Park -->

        <a
            href="/travel/europe-by-rail/gallery/amsterdam/park/"
            class="gallery-place"
        >

            <div class="gallery-cover">

                <img
                    src="/travel/europe-by-rail/gallery/amsterdam/park/park1.jpg"
                    alt="Park"
                >

            </div>

            <div class="gallery-place-info">

                <span class="gallery-number">
                    01
                </span>

                <h2>
                    Park
                </h2>

            </div>

        </a>


        <!-- 02 Canals -->

        <a
            href="/travel/europe-by-rail/gallery/amsterdam/canals/"
            class="gallery-place"
        >

            <div class="gallery-cover">

                <img
                    src="/travel/europe-by-rail/gallery/amsterdam/canals/canal1.jpg"
                    alt="Canals"
                >

            </div>

            <div class="gallery-place-info">

                <span class="gallery-number">
                    02
                </span>

                <h2>
                    Canals
                </h2>

            </div>

        </a>


        <!-- 03 Streets -->

        <a
            href="/travel/europe-by-rail/gallery/amsterdam/streets/"
            class="gallery-place"
        >

            <div class="gallery-cover">

                <img
                    src="/travel/europe-by-rail/gallery/amsterdam/streets/streets1.jpg"
                    alt="Streets"
                >

            </div>

            <div class="gallery-place-info">

                <span class="gallery-number">
                    03
                </span>

                <h2>
                    Streets
                </h2>

            </div>

        </a>


        <!-- 04 Zaanse Schans -->

        <a
            href="/travel/europe-by-rail/gallery/amsterdam/zaanse-schans/"
            class="gallery-place"
        >

            <div class="gallery-cover">

                <img
                    src="/travel/europe-by-rail/gallery/amsterdam/zaanse-schans/zaanse-schans1.jpg"
                    alt="Zaanse Schans"
                >

            </div>

            <div class="gallery-place-info">

                <span class="gallery-number">
                    04
                </span>

                <h2>
                    Zaanse Schans
                </h2>

            </div>

        </a>


        <!-- 05 Football -->

        <a
            href="/travel/europe-by-rail/gallery/amsterdam/football/"
            class="gallery-place"
        >

            <div class="gallery-cover">

                <img
                    src="/travel/europe-by-rail/gallery/amsterdam/football/orange1.jpg"
                    alt="Football"
                >

            </div>

            <div class="gallery-place-info">

                <span class="gallery-number">
                    05
                </span>

                <h2>
                    Football
                </h2>

            </div>

        </a>


        <!-- 06 Art -->

        <a
            href="/travel/europe-by-rail/gallery/amsterdam/art/"
            class="gallery-place"
        >

            <div class="gallery-cover">

                <img
                    src="/travel/europe-by-rail/gallery/amsterdam/art/art1.jpg"
                    alt="Art"
                >

            </div>

            <div class="gallery-place-info">

                <span class="gallery-number">
                    06
                </span>

                <h2>
                    Art
                </h2>

            </div>

        </a>

</html>
