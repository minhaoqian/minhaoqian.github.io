<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amsterdam | Europe by Rail</title>

    <link rel="stylesheet" href="../../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>


<body>

<main class="page-container gallery-city-index">

    <!-- Site identity -->

    <div class="site-mark">
        Neil. Q
    </div>


    <!-- Navigation -->

    <nav class="top-nav">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>
    </nav>


    <!-- Back -->

    <a
        class="trip-back"
        href="/travel/europe-by-rail/gallery/"
    >
        ← Europe Gallery
    </a>


    <!-- Header -->

    <header class="gallery-city-header">

        <h1>Amsterdam</h1>

        <p>
            Netherlands · June 2026
        </p>

    </header>


    <!-- Six category covers -->

    <section class="category-grid">


        <!-- 01 Park -->

        <a
            href="/travel/europe-by-rail/gallery/amsterdam/park/"
            class="category-card"
        >

            <div class="category-image">

                <img
                    src="park/park1.jpg"
                    alt="Park"
                >

            </div>

            <div class="category-info">

                <span>01</span>

                <h2>Park</h2>

            </div>

        </a>


        <!-- 02 Canals -->

        <a
            href="/travel/europe-by-rail/gallery/amsterdam/canals/"
            class="category-card"
        >

            <div class="category-image">

                <img
                    src="canals/canal1.jpg"
                    alt="Canals"
                >

            </div>

            <div class="category-info">

                <span>02</span>

                <h2>Canals</h2>

            </div>

        </a>


        <!-- 03 Streets -->

        <a
            href="/travel/europe-by-rail/gallery/amsterdam/streets/"
            class="category-card"
        >

            <div class="category-image">

                <img
                    src="streets/streets1.jpg"
                    alt="Streets"
                >

            </div>

            <div class="category-info">

                <span>03</span>

                <h2>Streets</h2>

            </div>

        </a>


        <!-- 04 Zaanse Schans -->

        <a
            href="/travel/europe-by-rail/gallery/amsterdam/zaanse-schans/"
            class="category-card"
        >

            <div class="category-image">

                <img
                    src="zaanse-schans/zaanse-schans1.jpg"
                    alt="Zaanse Schans"
                >

            </div>

            <div class="category-info">

                <span>04</span>

                <h2>Zaanse Schans</h2>

            </div>

        </a>


        <!-- 05 Football -->

        <a
            href="/travel/europe-by-rail/gallery/amsterdam/football/"
            class="category-card"
        >

            <div class="category-image">

                <img
                    src="football/orange1.jpg"
                    alt="Football"
                >

            </div>

            <div class="category-info">

                <span>05</span>

                <h2>Football</h2>

            </div>

        </a>


        <!-- 06 Art -->

        <a
            href="/travel/europe-by-rail/gallery/amsterdam/art/"
            class="category-card"
        >

            <div class="category-image">

                <img
                    src="art/art1.jpg"
                    alt="Art"
                >

            </div>

            <div class="category-info">

                <span>06</span>

                <h2>Art</h2>

            </div>

        </a>


    </section>


    <!-- Bottom -->

    <div class="gallery-end">

        <a href="/travel/europe-by-rail/gallery/">
            ← Europe Gallery
        </a>

    </div>

</main>

</body>
</html>
