<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Park | Amsterdam</title>

    <link rel="stylesheet" href="../../../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>


<body>

<main class="page-container photo-gallery-page">

    <!-- Site identity -->

    <div class="site-mark">
        Neil. Q
    </div>


    <!-- Navigation -->

    <nav class="top-nav">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>
    </nav>


    <!-- Back -->

    <a
        class="trip-back"
        href="/travel/europe-by-rail/gallery/amsterdam/"
    >
        ← Amsterdam
    </a>


    <!-- Header -->

    <header class="photo-gallery-header">

        <p>Amsterdam · Netherlands</p>

        <h1>Park</h1>

    </header>


    <!--
        4 photographs
        layout-four = 2 + 2
    -->

    <section class="photo-grid layout-four">

        <div class="photo-cell">
            <img
                src="park1.jpg"
                alt=""
                loading="lazy"
            >
        </div>

        <div class="photo-cell">
            <img
                src="park2.jpg"
                alt=""
                loading="lazy"
            >
        </div>

        <div class="photo-cell">
            <img
                src="park3.jpg"
                alt=""
                loading="lazy"
            >
        </div>

        <div class="photo-cell">
            <img
                src="park4.jpg"
                alt=""
                loading="lazy"
            >
        </div>

    </section>


    <!-- Bottom navigation -->

    <div class="gallery-end">

        <a href="/travel/europe-by-rail/gallery/amsterdam/">
            ← Amsterdam
        </a>

    </div>

</main>


<!-- ==================================================
     LIGHTBOX
     ================================================== -->

<div
    class="photo-lightbox"
    id="photoLightbox"
>

    <button
        class="lightbox-close"
        aria-label="Close image"
    >
        ×
    </button>

    <button
        class="lightbox-prev"
        aria-label="Previous image"
    >
        ‹
    </button>

    <img
        id="lightboxImage"
        src=""
        alt=""
    >

    <button
        class="lightbox-next"
        aria-label="Next image"
    >
        ›
    </button>

</div>


<script>

const galleryImages =
    Array.from(
        document.querySelectorAll(".photo-cell img")
    );

const lightbox =
    document.getElementById("photoLightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const closeButton =
    document.querySelector(".lightbox-close");

const previousButton =
    document.querySelector(".lightbox-prev");

const nextButton =
    document.querySelector(".lightbox-next");

let currentImageIndex = 0;


function showImage(index) {

    currentImageIndex =
        (index + galleryImages.length)
        % galleryImages.length;

    lightboxImage.src =
        galleryImages[currentImageIndex].src;

}


function openLightbox(index) {

    showImage(index);

    lightbox.classList.add("active");

    document.body.classList.add("lightbox-open");

}


function closeLightbox() {

    lightbox.classList.remove("active");

    document.body.classList.remove("lightbox-open");

}


galleryImages.forEach((image, index) => {

    image.addEventListener("click", () => {

        openLightbox(index);

    });

});


closeButton.addEventListener(
    "click",
    closeLightbox
);


previousButton.addEventListener(
    "click",
    () => {

        showImage(currentImageIndex - 1);

    }
);


nextButton.addEventListener(
    "click",
    () => {

        showImage(currentImageIndex + 1);

    }
);


lightbox.addEventListener(
    "click",
    event => {

        if (event.target === lightbox) {

            closeLightbox();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            !lightbox.classList.contains("active")
        ) {
            return;
        }

        if (event.key === "Escape") {
            closeLightbox();
        }

        if (event.key === "ArrowLeft") {
            showImage(currentImageIndex - 1);
        }

        if (event.key === "ArrowRight") {
            showImage(currentImageIndex + 1);
        }

    }
);

</script>

</body>
</html>
