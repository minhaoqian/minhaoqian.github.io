<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Park | Amsterdam</title>

    <link rel="stylesheet" href="../../../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<main class="page-container city-gallery">

    <div class="site-mark">
        Neil. Q
    </div>

    <nav class="top-nav">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>
    </nav>


    <!-- Back -->

    <a
        class="trip-back"
        href="/travel/europe-by-rail/gallery/amsterdam/"
    >
        ← Amsterdam
    </a>


    <!-- Header -->

    <section class="city-gallery-header">

        <p class="city-gallery-location">
            Amsterdam · Netherlands
        </p>

        <h1>Park</h1>

    </section>


    <!-- Photos -->

    <section class="photo-chapter">

        <div class="editorial-gallery layout-four">

            <img
                src="park1.jpg"
                alt=""
                loading="lazy"
            >

            <img
                src="park2.jpg"
                alt=""
                loading="lazy"
            >

            <img
                src="park3.jpg"
                alt=""
                loading="lazy"
            >

            <img
                src="park4.jpg"
                alt=""
                loading="lazy"
            >

        </div>

    </section>


    <!-- Bottom navigation -->

    <div class="gallery-end">

        <a href="/travel/europe-by-rail/gallery/amsterdam/">
            ← Amsterdam
        </a>

    </div>

</main>


<!-- Fullscreen viewer -->

<div class="photo-lightbox" id="photoLightbox">

    <button class="lightbox-close" aria-label="Close image">
        ×
    </button>

    <button class="lightbox-prev" aria-label="Previous image">
        ‹
    </button>

    <img id="lightboxImage" src="" alt="">

    <button class="lightbox-next" aria-label="Next image">
        ›
    </button>

</div>


<script>

const galleryImages =
    Array.from(document.querySelectorAll(".editorial-gallery img"));

const lightbox =
    document.getElementById("photoLightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const closeButton =
    document.querySelector(".lightbox-close");

const previousButton =
    document.querySelector(".lightbox-prev");

const nextButton =
    document.querySelector(".lightbox-next");

let currentImageIndex = 0;


function showImage(index) {

    currentImageIndex =
        (index + galleryImages.length) % galleryImages.length;

    const selectedImage =
        galleryImages[currentImageIndex];

    lightboxImage.src = selectedImage.src;
}


galleryImages.forEach((image, index) => {

    image.addEventListener("click", () => {

        showImage(index);

        lightbox.classList.add("active");

        document.body.classList.add("lightbox-open");

    });

});


closeButton.addEventListener("click", () => {

    lightbox.classList.remove("active");

    document.body.classList.remove("lightbox-open");

});


previousButton.addEventListener("click", () => {
    showImage(currentImageIndex - 1);
});


nextButton.addEventListener("click", () => {
    showImage(currentImageIndex + 1);
});


lightbox.addEventListener("click", event => {

    if (event.target === lightbox) {

        lightbox.classList.remove("active");

        document.body.classList.remove("lightbox-open");

    }

});


document.addEventListener("keydown", event => {

    if (!lightbox.classList.contains("active")) {
        return;
    }

    if (event.key === "Escape") {
        lightbox.classList.remove("active");
        document.body.classList.remove("lightbox-open");
    }

    if (event.key === "ArrowLeft") {
        showImage(currentImageIndex - 1);
    }

    if (event.key === "ArrowRight") {
        showImage(currentImageIndex + 1);
    }

});

</script>

</body>
</html>
