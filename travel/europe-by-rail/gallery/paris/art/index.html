<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Art | Paris</title>

    <link rel="stylesheet" href="../../../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<main class="page-container photo-gallery-page">

    <div class="site-mark">Neil. Q</div>

    <nav class="top-nav">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>
    </nav>

    <a
        class="trip-back"
        href="/travel/europe-by-rail/gallery/paris/"
    >
        ← Paris
    </a>


    <header class="photo-gallery-header">

        <p>Paris · France</p>

        <h1>Art</h1>

    </header>


    <!-- 6 photos · 3 + 3 -->

    <section class="photo-grid layout-six">

        <div class="photo-cell">
            <img src="art1.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="art2.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="art3.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="art4.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="art5.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="art6.jpg" alt="" loading="lazy">
        </div>

    </section>


    <div class="gallery-end">

        <a href="/travel/europe-by-rail/gallery/paris/">
            ← Paris
        </a>

    </div>

</main>


<div class="photo-lightbox" id="photoLightbox">

    <button class="lightbox-close" aria-label="Close image">×</button>

    <button class="lightbox-prev" aria-label="Previous image">‹</button>

    <img id="lightboxImage" src="" alt="">

    <button class="lightbox-next" aria-label="Next image">›</button>

</div>


<script src="../gallery.js"></script>

</body>
</html>
