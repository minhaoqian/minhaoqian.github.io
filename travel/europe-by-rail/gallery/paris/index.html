<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paris | Europe by Rail</title>

    <link rel="stylesheet" href="../../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<main class="page-container gallery-city-index">

    <div class="site-mark">Neil. Q</div>

    <nav class="top-nav">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>
    </nav>

    <a
        class="trip-back"
        href="/travel/europe-by-rail/gallery/"
    >
        ← Europe Gallery
    </a>


    <header class="gallery-city-header">

        <h1>Paris</h1>

        <p>France · June 2026</p>

    </header>


    <!-- 3 Galleries -->

    <section class="category-grid">


        <!-- Park -->

        <a href="park/" class="category-card">

            <div class="category-image">
                <img
                    src="park/park1.jpg"
                    alt="Park"
                >
            </div>

            <div class="category-info">
                <span>01</span>
                <h2>Park</h2>
            </div>

        </a>


        <!-- Birthday -->

        <a href="birthday/" class="category-card">

            <div class="category-image">
                <img
                    src="birthday/birthday1.jpg"
                    alt="Birthday"
                >
            </div>

            <div class="category-info">
                <span>02</span>
                <h2>Birthday</h2>
            </div>

        </a>


        <!-- Art -->

        <a href="art/" class="category-card">

            <div class="category-image">
                <img
                    src="art/art1.jpg"
                    alt="Art"
                >
            </div>

            <div class="category-info">
                <span>03</span>
                <h2>Art</h2>
            </div>

        </a>


    </section>


    <div class="gallery-end">

        <a href="/travel/europe-by-rail/gallery/">
            ← Europe Gallery
        </a>

    </div>

</main>

</body>
</html>
