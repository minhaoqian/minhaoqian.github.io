<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Park | Paris</title>

    <link rel="stylesheet" href="../../../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<main class="page-container photo-gallery-page">

    <!-- Site identity -->

    <div class="site-mark">
        Neil. Q
    </div>


    <!-- Navigation -->

    <nav class="top-nav">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>
    </nav>


    <!-- Back -->

    <a
        class="trip-back"
        href="/travel/europe-by-rail/gallery/paris/"
    >
        ← Paris
    </a>


    <!-- Header -->

    <header class="photo-gallery-header">

        <p>Paris · France</p>

        <h1>Park</h1>

    </header>


    <!--
        7 photographs
        layout-seven = 2 + 3 + 2
    -->

    <section class="photo-grid layout-seven">

        <div class="photo-cell">
            <img
                src="park1.jpg"
                alt=""
                loading="lazy"
            >
        </div>

        <div class="photo-cell">
            <img
                src="park2.jpg"
                alt=""
                loading="lazy"
            >
        </div>

        <div class="photo-cell">
            <img
                src="park3.jpg"
                alt=""
                loading="lazy"
            >
        </div>

        <div class="photo-cell">
            <img
                src="park4.jpg"
                alt=""
                loading="lazy"
            >
        </div>

        <div class="photo-cell">
            <img
                src="park5.jpg"
                alt=""
                loading="lazy"
            >
        </div>

        <div class="photo-cell">
            <img
                src="park6.jpg"
                alt=""
                loading="lazy"
            >
        </div>

        <div class="photo-cell">
            <img
                src="park7.jpg"
                alt=""
                loading="lazy"
            >
        </div>

    </section>


    <!-- Bottom navigation -->

    <div class="gallery-end">

        <a href="/travel/europe-by-rail/gallery/paris/">
            ← Paris
        </a>

    </div>

</main>


<!-- ==================================================
     LIGHTBOX
     ================================================== -->

<div
    class="photo-lightbox"
    id="photoLightbox"
>

    <button
        class="lightbox-close"
        aria-label="Close image"
    >
        ×
    </button>

    <button
        class="lightbox-prev"
        aria-label="Previous image"
    >
        ‹
    </button>

    <img
        id="lightboxImage"
        src=""
        alt=""
    >

    <button
        class="lightbox-next"
        aria-label="Next image"
    >
        ›
    </button>

</div>


<!-- Shared Paris Gallery JavaScript -->

<script src="../gallery.js"></script>


</body>
</html>
