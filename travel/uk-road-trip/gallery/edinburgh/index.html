<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edinburgh | UK Road Trip</title>

    <link rel="stylesheet" href="../../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<main class="page-container gallery-city-index">

    <div class="site-mark">Neil. Q</div>

    <nav class="top-nav">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>
    </nav>

    <a
        class="trip-back"
        href="/travel/uk-road-trip/gallery/"
    >
        ← UK Road Trip Gallery
    </a>

    <header class="gallery-city-header">
        <h1>Edinburgh</h1>
        <p>Scotland · September 2026</p>
    </header>


    <section class="category-grid">

        <!-- City -->

        <a href="city/" class="category-card">

            <div class="category-image">
                <img
                    src="city/city1.jpg"
                    alt="Edinburgh City"
                >
            </div>

            <div class="category-info">
                <span>01</span>
                <h2>City</h2>
            </div>

        </a>


        <!-- Moments -->

        <a href="moments/" class="category-card">

            <div class="category-image">
                <img
                    src="moments/moments1.jpg"
                    alt="Edinburgh Moments"
                >
            </div>

            <div class="category-info">
                <span>02</span>
                <h2>Moments</h2>
            </div>

        </a>


        <!-- Arthur's Seat -->

        <a href="arthur/" class="category-card">

            <div class="category-image">
                <img
                    src="arthur/arthur1.jpg"
                    alt="Arthur's Seat"
                >
            </div>

            <div class="category-info">
                <span>03</span>
                <h2>Arthur's Seat</h2>
            </div>

        </a>

    </section>


    <div class="gallery-end">
        <a href="/travel/uk-road-trip/gallery/">
            ← UK Road Trip Gallery
        </a>
    </div>
