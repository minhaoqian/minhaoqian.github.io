<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moments | Edinburgh</title>

    <link rel="stylesheet" href="../../../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<main class="page-container photo-gallery-page">

    <div class="site-mark">Neil. Q</div>

    <nav class="top-nav">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>
    </nav>

    <a
        class="trip-back"
        href="/travel/uk-road-trip/gallery/edinburgh/"
    >
        ← Edinburgh
    </a>

    <header class="photo-gallery-header">
        <p>Edinburgh · Scotland</p>
        <h1>Moments</h1>
    </header>


    <section class="photo-grid layout-six">

        <div class="photo-cell">
            <img src="moments1.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="moments2.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="moments3.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="moments4.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="moments5.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="moments6.jpg" alt="" loading="lazy">
        </div>

    </section>


    <div class="gallery-end">
        <a href="/travel/uk-road-trip/gallery/edinburgh/">
            ← Edinburgh
        </a>
    </div>

</main>


<div class="photo-lightbox" id="photoLightbox">

    <button class="lightbox-close" aria-label="Close image">×</button>

    <button class="lightbox-prev" aria-label="Previous image">‹</button>

    <img id="lightboxImage" src="" alt="">

    <button class="lightbox-next" aria-label="Next image">›</button>

</div>

<script src="../gallery.js"></script>

</body>
</html>
