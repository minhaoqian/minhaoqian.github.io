<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cambridge | UK Road Trip</title>

    <link rel="stylesheet" href="../../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<main class="page-container gallery-city-index">

    <div class="site-mark">Neil. Q</div>

    <nav class="top-nav">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>

    <a

        href="/travel/uk-road-trip/gallery/"

    <section class="category-grid cambridge-category-grid">

        <!-- Buildings -->

        <a href="buildings/" class="category-card">

        </a>

        <a href="river/" class="category-card">

            <div class="category-image">

                    src="river/river1.jpg"

            </div>

            <div class="category-info">
                <span>02</span>
                <h2>River</h2>
            </div>
