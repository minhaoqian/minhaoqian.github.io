<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Highlands | UK Road Trip</title>

    <link rel="stylesheet" href="../../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<main class="page-container gallery-city-index">

    <div class="site-mark">Neil. Q</div>

    <nav class="top-nav">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>
    </nav>

    <a
        class="trip-back"
        href="/travel/uk-road-trip/gallery/"
    >
        ← UK Road Trip Gallery
    </a>

    <header class="gallery-city-header">
        <h1>Highlands</h1>
        <p>Scotland · September 2026</p>
    </header>


    <section class="category-grid">

        <!-- Landmarks -->

        <a href="buildings/" class="category-card">

            <div class="category-image">
                <img
                    src="buildings/buildings1.jpg"
                    alt="Highland Landmarks"
                >
            </div>

            <div class="category-info">
                <span>01</span>
                <h2>Landmarks</h2>
            </div>

        </a>


        <!-- Mountains -->

        <a href="mountain/" class="category-card">

            <div class="category-image">
                <img
                    src="mountain/mountain1.jpg"
                    alt="Highland Mountains"
                >
            </div>

            <div class="category-info">
                <span>02</span>
                <h2>Mountains</h2>
            </div>

        </a>


        <!-- Waters -->

        <a href="water/" class="category-card">

            <div class="category-image">
                <img
                    src="water/water5.jpg"
                    alt="Highland Waters"
                >
            </div>

            <div class="category-info">
                <span>03</span>
                <h2>Waters</h2>
            </div>

        </a>

    </section>


    <div class="gallery-end">
        <a href="/travel/uk-road-trip/gallery/">
            ← UK Road Trip Gallery
        </a>
    </div>

</main>

</body>
</html>
