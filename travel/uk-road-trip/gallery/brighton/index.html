<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brighton | UK Road Trip</title>

    <link rel="stylesheet" href="../../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<main class="page-container gallery-city-index">

    <!-- Site identity -->

    <div class="site-mark">
        Neil. Q
    </div>


    <!-- Navigation -->

    <nav class="top-nav">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>
    </nav>


    <!-- Back -->

    <a
        class="trip-back"
        href="/travel/uk-road-trip/gallery/"
    >
        ← UK Road Trip Gallery
    </a>


    <!-- Header -->

    <header class="gallery-city-header">

        <h1>Brighton</h1>

        <p>England · September 2026</p>

    </header>


    <!-- Categories -->

    <section class="category-grid">


        <!-- 01 Beach -->

        <a
            href="beach/"
            class="category-card"
        >

            <div class="category-image">
                <img
                    src="beach/beach1.jpg"
                    alt="Brighton Beach"
                >
            </div>

            <div class="category-info">

                <span>01</span>

                <h2>Beach</h2>

            </div>

        </a>


        <!-- 02 City -->

        <a
            href="city/"
            class="category-card"
        >

            <div class="category-image">
                <img
                    src="city/city1.jpg"
                    alt="Brighton City"
                >
            </div>

            <div class="category-info">

                <span>02</span>

                <h2>City</h2>

            </div>

        </a>


        <!-- 03 Cliff -->

        <a
            href="cliff/"
            class="category-card"
        >

            <div class="category-image">
                <img
                    src="cliff/cliff1.jpg"
                    alt="Cliffs near Brighton"
                >
            </div>

            <div class="category-info">

                <span>03</span>

                <h2>Cliff</h2>

            </div>

        </a>


    </section>


    <!-- Bottom navigation -->

    <div class="gallery-end">

        <a href="/travel/uk-road-trip/gallery/">
            ← UK Road Trip Gallery
        </a>

    </div>

</main>

</body>
</html>
