<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beach | Brighton</title>

    <link rel="stylesheet" href="../../../../../style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<main class="page-container photo-gallery-page">

    <div class="site-mark">Neil. Q</div>

    <nav class="top-nav">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/football/">Football</a>
        <a href="/travel/">Travel</a>
        <a href="/archive/">Archive</a>
    </nav>

    <a
        class="trip-back"
        href="/travel/uk-road-trip/gallery/brighton/"
    >
        ← Brighton
    </a>

    <header class="photo-gallery-header">
        <p>Brighton · England</p>
        <h1>Beach</h1>
    </header>

    <!-- 5 photos · 2 + 3 -->

    <section class="photo-grid layout-five">

        <div class="photo-cell">
            <img src="beach1.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="beach2.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="beach3.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="beach4.jpg" alt="" loading="lazy">
        </div>

        <div class="photo-cell">
            <img src="beach5.jpg" alt="" loading="lazy">
        </div>

    </section>

    <div class="gallery-end">
        <a href="/travel/uk-road-trip/gallery/brighton/">
            ← Brighton
        </a>
    </div>

</main>


<!-- Lightbox -->

<div class="photo-lightbox" id="photoLightbox">

    <button
        class="lightbox-close"
        aria-label="Close image"
    >
        ×
    </button>

    <button
        class="lightbox-prev"
        aria-label="Previous image"
    >
        ‹
    </button>

    <img
        id="lightboxImage"
        src=""
        alt=""
    >

    <button
        class="lightbox-next"
        aria-label="Next image"
    >
        ›
    </button>

</div>


<script src="../gallery.js"></script>

</body>
</html>
