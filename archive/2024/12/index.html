      <h1>December 2024</h1>
      <p class="month-epigraph">
        冬日 · 静候
      </p>

      <div class="month-photos">

        <div class="photo-block left">
          <img src="/archive/2024/12/2412_1.jpg" alt="Winter street">
          <div class="caption">
            <span class="photo-title">岁末微光</span>
            <span class="photo-desc">
              伦敦进入真正的冬天，天色总是很早就暗下来。走在街头，路灯亮起，空气里带着一点潮湿的寒意。忙碌了一整年，终于慢慢放缓脚步。
            </span>
          </div>
        </div>

        <div class="photo-block right">
          <img src="/archive/2024/12/2412_2.jpg" alt="Friends dinner">
          <div class="caption">
            <span class="photo-title">冬夜小聚</span>
            <span class="photo-desc">
              和朋友们围坐在一起吃饭聊天。屋外寒风凛冽，屋内却温暖明亮。那些看似普通的夜晚，反而最值得被记住。
            </span>
          </div>
        </div>

        <div class="photo-block left">
          <img src="/archive/2024/12/2412_3.jpg" alt="Year end reflection">
          <div class="caption">
            <span class="photo-title">回望与期待</span>
            <span class="photo-desc">
              一年将尽，回头看看走过的路，有遗憾，也有收获。更多的，是对下一段旅程的期待。
            </span>
          </div>
        </div>

      </div>
