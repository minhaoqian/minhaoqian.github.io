      <h1>October 2023</h1>
      <p class="month-epigraph">
       初来乍到
      </p>

      <div class="month-photos">

        <div class="photo-block left">
          <img src="/archive/2023/10/2310_1.jpg" alt="Autumn campus walk">
          <div class="caption">
            <span class="photo-title">面向海风</span>
            <span class="photo-desc">
              留学的第一次旅行来到了多佛白崖。虽然只是十月，海风却异常猛烈，天气也很冷。海浪拍打着岸，有节奏地涌来涌去。很喜欢这种不羁的感觉，一个人沿着白崖奔跑丝毫不觉得累。
            </span>
          </div>
        </div>

        <div class="photo-block right">
          <img src="/archive/2023/10/2310_2.jpg" alt="Football match">
          <div class="caption">
            <span class="photo-title">烹饪起航</span>
            <span class="photo-desc">
              只是刚到伦敦几天，便一鼓作气将所有需要的锅碗瓢盆和厨房用品购置齐全。万事俱备，准备开工！
            </span>
          </div>
        </div>

        <div class="photo-block left">
          <img src="/archive/2023/10/2310_3.jpg" alt="Homemade meal">
          <div class="caption">
            <span class="photo-title">生日盛宴</span>
            <span class="photo-desc">
              刚开始下厨，总是干劲十足。一个人只花不到两个小时就做好一桌子大餐，准备好为同学庆生。
            </span>
          </div>
        </div>

      </div>
