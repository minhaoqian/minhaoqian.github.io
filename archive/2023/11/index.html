      <h1>November 2023</h1>
      <p class="month-epigraph">
        陌城初印
      </p>

      <div class="month-photos">

        <div class="photo-block left">
          <img src="/archive/2023/11/2311_1.jpg" alt="Rainy campus walk">
          <div class="caption">
            <span class="photo-title">牛津·初遇</span>
            <span class="photo-desc">
              在zky的带领下，和高中同学一起参观了牛津大学。天气晴朗，我们爬上教堂塔楼俯瞰整座城市，街道与建筑散发着浓厚的中世纪气息。也许有一天我也能来到这里念书。
            </span>
          </div>
        </div>

        <div class="photo-block right">
          <img src="/archive/2023/11/2312_3.jpg" alt="Football match">
          <div class="caption">
            <span class="photo-title">雨夜·足球</span>
            <span class="photo-desc">
              脚踝尚未康复，但是按捺不住踢球的冲动，浑身被淋湿也无所谓。给自己做一顿蜂蜜脆皮鸡腿，搭配一瓶啤酒，是独属于足球人的浪漫。
            </span>
          </div>
        </div>

        <div class="photo-block left">
          <img src="/archive/2023/11/2311_2.jpg" alt="Homemade meal">
          <div class="caption">
            <span class="photo-title">厨艺渐长</span>
            <span class="photo-desc">
              大一的空闲时光很多，每天都要好好做饭，给生活增添一份仪式感。
            </span>
          </div>
        </div>
